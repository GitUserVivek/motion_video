<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="minimalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
    <pattern id="subtleDots" patternUnits="userSpaceOnUse" width="60" height="60">
      <circle cx="30" cy="30" r="1" fill="rgba(0,0,0,0.05)" />
    </pattern>
  </defs>

  <!-- Background Gradient -->
  <rect width="1920" height="1080" fill="url(#minimalGradient)" />

  <!-- Subtle Pattern -->
  <rect width="1920" height="1080" fill="url(#subtleDots)" />

  <!-- Very Subtle Shadows -->
  <radialGradient id="shadow1" cx="20%" cy="80%" r="30%">
    <stop offset="0%" style="stop-color:rgba(0,0,0,0.02);stop-opacity:1" />
    <stop offset="100%" style="stop-color:rgba(0,0,0,0);stop-opacity:0" />
  </radialGradient>
  <radialGradient id="shadow2" cx="80%" cy="20%" r="25%">
    <stop offset="0%" style="stop-color:rgba(0,0,0,0.015);stop-opacity:1" />
    <stop offset="100%" style="stop-color:rgba(0,0,0,0);stop-opacity:0" />
  </radialGradient>

  <rect width="1920" height="1080" fill="url(#shadow1)" />
  <rect width="1920" height="1080" fill="url(#shadow2)" />
</svg>

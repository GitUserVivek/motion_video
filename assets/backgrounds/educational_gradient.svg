<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="eduGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="50" height="50">
      <circle cx="25" cy="25" r="1" fill="rgba(255,255,255,0.1)" />
    </pattern>
  </defs>

  <!-- Background Gradient -->
  <rect width="1920" height="1080" fill="url(#eduGradient)" />

  <!-- Subtle Dots Pattern -->
  <rect width="1920" height="1080" fill="url(#dots)" opacity="0.5" />

  <!-- Light Sources for Depth -->
  <radialGradient id="light1" cx="20%" cy="20%" r="50%">
    <stop offset="0%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
    <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
  </radialGradient>
  <radialGradient id="light2" cx="80%" cy="80%" r="50%">
    <stop offset="0%" style="stop-color:rgba(120,190,255,0.15);stop-opacity:1" />
    <stop offset="100%" style="stop-color:rgba(120,190,255,0);stop-opacity:0" />
  </radialGradient>

  <rect width="1920" height="1080" fill="url(#light1)" />
  <rect width="1920" height="1080" fill="url(#light2)" />
</svg>

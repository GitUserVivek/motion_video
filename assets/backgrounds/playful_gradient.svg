<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="playfulGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f5576c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" />
    </filter>
    <radialGradient id="circle1" cx="30%" cy="30%" r="20%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.2);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
    </radialGradient>
    <radialGradient id="circle2" cx="70%" cy="70%" r="25%">
      <stop offset="0%" style="stop-color:rgba(0,150,255,0.15);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(0,150,255,0);stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background Gradient -->
  <rect width="1920" height="1080" fill="url(#playfulGradient)" />

  <!-- Light Circles -->
  <circle cx="300" cy="200" r="150" fill="url(#circle1)" />
  <circle cx="1400" cy="800" r="200" fill="url(#circle2)" />

  <!-- Floating Bubbles -->
  <g opacity="0.7">
    <circle cx="200" cy="400" r="30" fill="rgba(255,255,255,0.15)" />
    <circle cx="600" cy="300" r="20" fill="rgba(255,255,255,0.1)" />
    <circle cx="1000" cy="500" r="25" fill="rgba(255,255,255,0.12)" />
    <circle cx="1200" cy="200" r="15" fill="rgba(255,255,255,0.08)" />
    <circle cx="800" cy="700" r="18" fill="rgba(255,255,255,0.1)" />
  </g>
</svg>

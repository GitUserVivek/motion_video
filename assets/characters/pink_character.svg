<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <!-- Head -->
  <circle cx="100" cy="55" r="45" fill="#E91E63" />

  <!-- Eyes -->
  <circle cx="85" cy="50" r="7" fill="white" />
  <circle cx="115" cy="50" r="7" fill="white" />
  <circle cx="87" cy="52" r="4" fill="#1a1a2e" />
  <circle cx="117" cy="52" r="4" fill="#1a1a2e" />

  <!-- Smile -->
  <path d="M85 70 Q100 82 115 70" stroke="#1a1a2e" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Body -->
  <rect x="70" y="100" width="60" height="80" rx="10" fill="#E91E63" />

  <!-- Left Arm -->
  <g transform="translate(70, 110)">
    <rect x="-30" y="-8" width="32" height="16" rx="8" fill="#E91E63" />
    <circle cx="-30" cy="0" r="10" fill="#FFD700" />
  </g>

  <!-- Right Arm -->
  <g transform="translate(130, 110)">
    <rect x="0" y="-8" width="32" height="16" rx="8" fill="#E91E63" />
    <circle cx="32" cy="0" r="10" fill="#FFD700" />
  </g>

  <!-- Legs -->
  <rect x="78" y="178" width="18" height="50" rx="9" fill="#E91E63" />
  <rect x="104" y="178" width="18" height="50" rx="9" fill="#E91E63" />

  <!-- Feet -->
  <ellipse cx="87" cy="228" rx="16" ry="8" fill="#FFD700" />
  <ellipse cx="113" cy="228" rx="16" ry="8" fill="#FFD700" />
</svg>
